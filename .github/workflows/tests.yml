name: Buildbpy unit tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y zstd
      - run: python -m pip install -e . pytest pytest-cov==7.1.0 coverage==7.16.0
      - run: python -m pytest tests/ --cov=buildbpy.cuda_wheel --cov-report=term-missing
